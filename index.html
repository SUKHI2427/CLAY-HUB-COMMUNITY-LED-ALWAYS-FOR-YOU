<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24180F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>Clay Hub: community-led, always for you</title>
<style>
:root{--brand:#B5532A;--brand2:#D9803F;--clay:#5B7F3F;--dark:#24180F;--bg:#F6F2EC;--card:#fff;--text:#1d2a2d;--mute:#6b7a7d;--line:#e4ddd2;--ok:#2e8b57;--bad:#c0392b;--r:16px;--sh:0 2px 10px rgba(31,85,96,.10);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#17110c;--card:#241a12;--text:#f4ebe0;--mute:#b7a592;--line:#3d2d20;--sh:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
button,input,textarea,select{font:inherit;color:inherit}
header{background:var(--dark);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:1.1rem;margin:0;flex:1}
.logo{width:38px;height:38px;border-radius:10px;background:#fff;object-fit:contain;display:grid;place-items:center;font-size:22px}
main{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.card h3{margin:0 0 4px;font-size:1rem}.mute{color:var(--mute);font-size:.85rem}
.btn{background:var(--brand);color:#fff;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:600}
.btn.alt{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn.clay{background:var(--clay)}.btn.bad{background:var(--bad)}.btn.sm{padding:6px 10px;font-size:.85rem}
.btn:disabled{opacity:.5}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin:4px 0 10px}
label{font-size:.85rem;font-weight:600}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:8px 2px;font-size:.7rem;color:var(--mute);cursor:pointer}
nav button b{display:block;font-size:1.25rem}nav button.on{color:var(--brand);font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.pill{background:var(--brand);color:#fff;border-radius:99px;padding:2px 10px;font-size:.75rem}
.pill.p{background:var(--clay)}.pill.g{background:var(--ok)}header .logo{background:none;border-radius:50%}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#e9a15b)}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.tabs button{white-space:nowrap}
#splash{position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,#4a2d18,#17110c 70%);color:#fff;display:grid;place-items:center;text-align:center;z-index:20;cursor:pointer}
#splash .logo{width:min(70vw,300px);height:min(70vw,300px);border-radius:24px;margin:0 auto 12px;background:none;display:block}
.rank{width:28px;text-align:center;font-weight:700}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;z-index:30}
:focus-visible{outline:3px solid var(--clay);outline-offset:2px}
</style>
</head>
<body>
<div id="splash" role="button" tabindex="0" aria-label="Continue"><div><div id="sLogo"></div><p style="color:#f3d9a8;margin:0">Community-led, always for you</p><p style="color:#b7a592">Tap to continue</p></div></div>
<header><span id="hLogo" style="display:flex"></span><h1>Clay Hub</h1><span id="who"></span></header>
<main id="app"></main>
<nav id="nav" hidden></nav>
<script>
const K='clayhub_v2',S='clayhub_session';
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const blank=()=>({admin:null,users:[],ann:[],events:[],chal:[],subs:[],posts:[],logo:'',badges:[]});
let db;try{db=Object.assign(blank(),JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){db=blank()}
let me=null,view='home',atab='review',mode='login';
try{me=localStorage.getItem(S)}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){toast('Storage full or blocked')}};
const hash=async p=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p)))].map(b=>b.toString(16).padStart(2,'0')).join('');
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
const user=()=>me==='ADMIN'?{id:'ADMIN',name:db.admin?.name||'Admin',admin:true}:db.users.find(u=>u.id===me);
const lvl=p=>Math.floor(p/100)+1;
const date=t=>new Date(t).toLocaleString([], {dateStyle:'medium',timeStyle:'short'});
function logoHTML(big){const src=db.logo||(big?'logo.png':'icon.png');return `<img class="logo" src="${src}" alt="Clay Hub logo" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'logo',textContent:'🏺'}))">`}
function paintLogos(){const hl=$('#hLogo');if(hl)hl.innerHTML=logoHTML(false);const s=$('#sLogo');if(s)s.innerHTML=logoHTML(true)}
$('#splash').onclick=()=>$('#splash').remove();
$('#splash').onkeydown=e=>{if(e.key==='Enter'||e.key===' ')$('#splash').remove()};

/* ---------- AUTH ---------- */
function authView(){
 const setup=!db.admin&&mode==='admin';
 return `<div class="card"><div class="tabs"><button class="btn ${mode==='login'?'':'alt'} sm" onclick="mode='login';render()">Student login</button><button class="btn ${mode==='signup'?'':'alt'} sm" onclick="mode='signup';render()">Sign up</button><button class="btn ${mode==='admin'?'':'alt'} sm" onclick="mode='admin';render()">Admin</button></div>
 ${mode==='admin'?`<h3>${setup?'Create the admin account (first time)':'Admin login'}</h3>`:''}
 ${mode==='signup'||setup?`<label>Name</label><input id="n" autocomplete="name">`:''}
 ${mode==='signup'?`<label>Department / Year (optional)</label><input id="d">`:''}
 ${mode!=='admin'?`<label>Username</label><input id="u" autocomplete="username">`:''}
 <label>Password</label><input id="p" type="password" autocomplete="current-password">
 <button class="btn" onclick="auth()">${mode==='signup'?'Create account':setup?'Create admin':'Log in'}</button>
 <p class="mute">All data is stored on this device. No demo accounts or scores — everything starts empty.</p></div>`}
async function auth(){
 const p=$('#p').value,h=await hash(p);
 if(p.length<4)return toast('Password needs 4+ characters');
 if(mode==='admin'){
  if(!db.admin){const n=$('#n').value.trim();if(!n)return toast('Enter a name');db.admin={name:n,h};save()}
  else if(db.admin.h!==h)return toast('Wrong admin password');
  me='ADMIN';view='admin'
 }else if(mode==='signup'){
  const n=$('#n').value.trim(),u=$('#u').value.trim().toLowerCase();
  if(!n||!u)return toast('Name and username required');
  if(db.users.some(x=>x.u===u))return toast('Username taken');
  const o={id:uid(),n,u,h,dept:$('#d').value.trim(),pts:0,badges:[],joined:Date.now(),rsvp:[]};db.users.push(o);save();me=o.id;view='home'
 }else{
  const o=db.users.find(x=>x.u===$('#u').value.trim().toLowerCase()&&x.h===h);
  if(!o)return toast('Wrong username or password');me=o.id;view='home'
 }
 try{localStorage.setItem(S,me)}catch(e){}render()}
function logout(){me=null;try{localStorage.removeItem(S)}catch(e){}mode='login';render()}

/* ---------- STUDENT VIEWS ---------- */
function home(u){
 const next=db.events.filter(e=>e.at>Date.now()).sort((a,b)=>a.at-b.at)[0];
 return `${u.admin?'':`<div class="card"><div class="row"><h3 class="sp">Hi, ${esc(u.n)}</h3><span class="pill p">Level ${lvl(u.pts)}</span></div><div class="bar"><i style="width:${u.pts%100}%"></i></div><div class="mute">${u.pts} pts · ${100-u.pts%100} to next level</div></div>`}
 <h3>📢 Announcements</h3>${db.ann.length?db.ann.slice().reverse().map(a=>`<div class="card"><h3>${esc(a.t)}</h3><div>${esc(a.b)}</div><div class="mute">${date(a.at)}</div></div>`).join(''):'<div class="empty">No announcements yet.</div>'}
 ${next?`<h3>📅 Next event</h3><div class="card"><h3>${esc(next.t)}</h3><div class="mute">${date(next.at)} · ${esc(next.loc)}</div></div>`:''}`}
function events(u){
 const l=db.events.slice().sort((a,b)=>a.at-b.at);
 return `<h3>📅 Events</h3>${l.length?l.map(e=>{const going=!u.admin&&u.rsvp.includes(e.id),n=db.users.filter(x=>x.rsvp.includes(e.id)).length;
 return `<div class="card"><h3>${esc(e.t)}</h3><div>${esc(e.d)}</div><div class="mute">${date(e.at)} · ${esc(e.loc)} · ${n} going</div>${u.admin?'':`<button class="btn sm ${going?'alt':''}" onclick="rsvp('${e.id}')">${going?'✓ Going (tap to cancel)':'RSVP'}</button>`}</div>`}).join(''):'<div class="empty">No events yet.</div>'}`}
function rsvp(id){const u=user(),i=u.rsvp.indexOf(id);i<0?u.rsvp.push(id):u.rsvp.splice(i,1);save();render()}
function challenges(u){
 return `<h3>🎯 Challenges</h3>${db.chal.length?db.chal.map(c=>{const s=db.subs.find(x=>x.c===c.id&&x.u===u.id);
 return `<div class="card"><div class="row"><h3 class="sp">${esc(c.t)}</h3><span class="pill p">+${c.pts} pts</span></div><div>${esc(c.d)}</div>
 ${u.admin?'':s?`<span class="pill ${s.st==='approved'?'g':''}">${s.st==='approved'?'Approved ✓':'Pending review'}</span>`:`<textarea id="pr${c.id}" rows="2" placeholder="Describe what you did (proof)"></textarea><button class="btn sm clay" onclick="submitC('${c.id}')">Submit</button>`}</div>`}).join(''):'<div class="empty">No challenges yet.</div>'}`}
function submitC(id){const t=$('#pr'+id).value.trim();if(!t)return toast('Add a short proof');db.subs.push({id:uid(),c:id,u:me,proof:t,st:'pending',at:Date.now()});save();toast('Submitted for review');render()}
function board(u){
 const l=db.users.slice().sort((a,b)=>b.pts-a.pts);
 return `<h3>🏆 Leaderboard</h3>${l.length?`<div class="card">${l.map((x,i)=>`<div class="row" style="padding:6px 0;${x.id===me?'font-weight:700':''}"><span class="rank">${['🥇','🥈','🥉'][i]||i+1}</span><span class="sp">${esc(x.n)} <span class="mute">${esc(x.dept)}</span></span><span>${x.pts} pts</span></div>`).join('')}</div>`:'<div class="empty">No members yet. Be the first to join!</div>'}`}
function community(u){
 return `<h3>💬 Community</h3><div class="card"><textarea id="np" rows="2" placeholder="Share an idea, ask for help, celebrate a win…"></textarea><button class="btn sm" onclick="post()">Post</button></div>
 ${db.posts.length?db.posts.slice().reverse().map(p=>{const liked=p.likes.includes(me);return `<div class="card"><b>${esc(p.name)}</b> <span class="mute">${date(p.at)}</span><div>${esc(p.t)}</div><div class="row"><button class="btn alt sm" onclick="like('${p.id}')">${liked?'❤️':'🤍'} ${p.likes.length}</button>${u.admin||p.by===me?`<button class="btn alt sm" onclick="delPost('${p.id}')">Delete</button>`:''}</div></div>`}).join(''):'<div class="empty">No posts yet.</div>'}`}
function post(){const t=$('#np').value.trim();if(!t)return;const u=user();db.posts.push({id:uid(),by:me,name:u.admin?u.name+' (Admin)':u.n,t,at:Date.now(),likes:[]});save();render()}
function like(id){const p=db.posts.find(x=>x.id===id),i=p.likes.indexOf(me);i<0?p.likes.push(me):p.likes.splice(i,1);save();render()}
function delPost(id){db.posts=db.posts.filter(x=>x.id!==id);save();render()}
function profile(u){
 if(u.admin)return `<div class="card"><h3>${esc(u.name)}</h3><div class="mute">Administrator</div></div>`;
 return `<div class="card"><h3>${esc(u.n)}</h3><div class="mute">@${esc(u.u)} ${esc(u.dept)}</div><p>Level <b>${lvl(u.pts)}</b> · <b>${u.pts}</b> points</p><div class="bar"><i style="width:${u.pts%100}%"></i></div>
 <h3>🏅 Badges</h3>${u.badges.length?u.badges.map(b=>`<span class="pill p">${esc(b)}</span> `).join(''):'<div class="mute">No badges yet — the admin can award them.</div>'}
 <h3 style="margin-top:12px">Activity</h3><div class="mute">${db.subs.filter(s=>s.u===u.id&&s.st==='approved').length} challenges completed · ${u.rsvp.length} event RSVPs</div></div>`}

/* ---------- ADMIN ---------- */
function admin(){
 const T=[['review','Reviews'],['ann','Announce'],['ev','Events'],['ch','Challenges'],['us','Members'],['set','Settings']];
 const pend=db.subs.filter(s=>s.st==='pending').length;
 let b='';
 if(atab==='review'){const l=db.subs.filter(s=>s.st==='pending');b=l.length?l.map(s=>{const c=db.chal.find(x=>x.id===s.c),u=db.users.find(x=>x.id===s.u);return `<div class="card"><h3>${esc(u?.n)} → ${esc(c?.t)}</h3><div>${esc(s.proof)}</div><div class="row"><button class="btn sm" onclick="review('${s.id}',1)">Approve +${c?.pts}</button><button class="btn bad sm" onclick="review('${s.id}',0)">Reject</button></div></div>`}).join(''):'<div class="empty">No pending submissions.</div>'}
 if(atab==='ann')b=`<div class="card"><label>Title</label><input id="at"><label>Message</label><textarea id="ab" rows="3"></textarea><button class="btn" onclick="addA()">Publish</button></div>`+db.ann.map(a=>`<div class="card row"><span class="sp">${esc(a.t)}</span><button class="btn alt sm" onclick="del('ann','${a.id}')">Delete</button></div>`).join('');
 if(atab==='ev')b=`<div class="card"><label>Title</label><input id="et"><label>Description</label><textarea id="ed" rows="2"></textarea><label>Date & time</label><input id="ea" type="datetime-local"><label>Location</label><input id="el"><button class="btn" onclick="addE()">Add event</button></div>`+db.events.map(a=>`<div class="card row"><span class="sp">${esc(a.t)}<br><span class="mute">${date(a.at)}</span></span><button class="btn alt sm" onclick="del('events','${a.id}')">Delete</button></div>`).join('');
 if(atab==='ch')b=`<div class="card"><label>Title</label><input id="ct"><label>Description</label><textarea id="cd" rows="2"></textarea><label>Points</label><input id="cp" type="number" value="20" min="1"><button class="btn" onclick="addC()">Add challenge</button></div>`+db.chal.map(a=>`<div class="card row"><span class="sp">${esc(a.t)} <span class="pill p">+${a.pts}</span></span><button class="btn alt sm" onclick="del('chal','${a.id}')">Delete</button></div>`).join('');
 if(atab==='us')b=db.users.length?db.users.map(u=>`<div class="card"><div class="row"><b class="sp">${esc(u.n)}</b><span>${u.pts} pts</span></div><div class="row"><input id="g${u.id}" type="number" placeholder="± points" style="width:110px;margin:0"><button class="btn sm" onclick="award('${u.id}')">Give</button><input id="b${u.id}" placeholder="Badge name" style="width:130px;margin:0"><button class="btn sm clay" onclick="badge('${u.id}')">Badge</button><button class="btn bad sm" onclick="rmUser('${u.id}')">Remove</button></div></div>`).join(''):'<div class="empty">No members have joined yet.</div>';
 if(atab==='set')b=`<div class="card"><h3>App logo</h3><div class="mute">Your Clay Hub emblem is built in. Upload a different image here only if you want to replace it.</div><input type="file" accept="image/*" onchange="setLogo(this)"><button class="btn alt sm" onclick="db.logo='';save();paintLogos();render()">Restore default logo</button></div>
 <div class="card"><h3>Backup</h3><button class="btn sm" onclick="exp()">Export data (JSON)</button></div>
 <div class="card"><h3>Reset</h3><div class="mute">Deletes all members, posts, events and scores.</div><button class="btn bad sm" onclick="if(confirm('Erase ALL app data?')){db=blank();save();logout()}">Reset everything</button></div>`;
 return `<div class="row"><h3 class="sp">🛠 Admin</h3><span class="pill">${db.users.length} members</span></div><div class="tabs">${T.map(([k,n])=>`<button class="btn sm ${atab===k?'':'alt'}" onclick="atab='${k}';render()">${n}${k==='review'&&pend?` (${pend})`:''}</button>`).join('')}</div>${b}`}
function addA(){const t=$('#at').value.trim(),b=$('#ab').value.trim();if(!t)return;db.ann.push({id:uid(),t,b,at:Date.now()});save();render()}
function addE(){const t=$('#et').value.trim(),a=$('#ea').value;if(!t||!a)return toast('Title and date required');db.events.push({id:uid(),t,d:$('#ed').value.trim(),at:new Date(a).getTime(),loc:$('#el').value.trim()});save();render()}
function addC(){const t=$('#ct').value.trim();if(!t)return;db.chal.push({id:uid(),t,d:$('#cd').value.trim(),pts:+$('#cp').value||10});save();render()}
function del(k,id){db[k]=db[k].filter(x=>x.id!==id);save();render()}
function review(id,ok){const s=db.subs.find(x=>x.id===id);s.st=ok?'approved':'rejected';if(ok){const u=db.users.find(x=>x.id===s.u),c=db.chal.find(x=>x.id===s.c);if(u&&c)u.pts+=c.pts}save();render()}
function award(id){const v=+$('#g'+id).value;if(!v)return;const u=db.users.find(x=>x.id===id);u.pts=Math.max(0,u.pts+v);save();render()}
function badge(id){const v=$('#b'+id).value.trim();if(!v)return;db.users.find(x=>x.id===id).badges.push(v);save();render()}
function rmUser(id){if(confirm('Remove this member?')){db.users=db.users.filter(x=>x.id!==id);save();render()}}
function setLogo(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{db.logo=r.result;save();paintLogos();toast('Logo updated');render()};r.readAsDataURL(f)}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));a.download='clayhub-backup.json';a.click()}

/* ---------- SHELL ---------- */
function render(){
 const u=me&&user();if(me&&!u){me=null}
 paintLogos();
 $('#who').innerHTML=u?`<button class="btn alt sm" style="color:#fff;border-color:#fff" onclick="logout()">Logout</button>`:'';
 const nav=$('#nav');
 if(!u){nav.hidden=true;$('#app').innerHTML=authView();return}
 const items=[['home','🏠','Home'],['events','📅','Events'],['chal','🎯','Tasks'],['board','🏆','Ranks'],['comm','💬','Chat'],...(u.admin?[['admin','🛠','Admin']]:[['me','👤','Me']])];
 nav.hidden=false;nav.innerHTML=items.map(([k,i,n])=>`<button class="${view===k?'on':''}" onclick="view='${k}';render();scrollTo(0,0)"><b>${i}</b>${n}</button>`).join('');
 const V={home,events,chal:challenges,board,comm:community,me:profile,admin};
 $('#app').innerHTML=(V[view]||home)(u);
}
render();
</script>
</body>
</html>
