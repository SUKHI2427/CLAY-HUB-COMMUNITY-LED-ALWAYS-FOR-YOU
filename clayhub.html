<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5560">
<title>ClayHub: shaping a better campus together</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF1EF; --surface:#FFFFFF; --ink:#14262B; --muted:#587076; --glaze:#1F5560; --glaze-ink:#FFFFFF;
  --kiln:#F2B84B; --kiln-ink:#3A2600; --celadon:#CFE3DA; --line:#D3E0DC; --danger:#B4483A; --ok:#2E7D5B;
  --head:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif; --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1C20; --surface:#172A2F; --ink:#E7F0EE; --muted:#93AAAF; --glaze:#7FC1B0; --glaze-ink:#0E1C20;
    --celadon:#22424A; --line:#274046; --danger:#E27D6D; --ok:#66C596;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1C20; --surface:#172A2F; --ink:#E7F0EE; --muted:#93AAAF; --glaze:#7FC1B0; --glaze-ink:#0E1C20;
  --celadon:#22424A; --line:#274046; --danger:#E27D6D; --ok:#66C596;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:20px 16px 110px}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.15;letter-spacing:-.01em}
h2{font-size:1.5rem;font-weight:800;margin-bottom:4px}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.sub{color:var(--muted);font-size:.92rem;margin-bottom:16px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--kiln);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.tag{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--celadon);color:var(--ink)}
.tag.lost{background:#F6D5CF;color:#6B2118}.tag.found{background:#CDEBD9;color:#12482E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.lost{background:#5A2A24;color:#F6D5CF}:root:not([data-theme="light"]) .tag.found{background:#1F4A36;color:#CDEBD9}}
:root[data-theme="dark"] .tag.lost{background:#5A2A24;color:#F6D5CF}:root[data-theme="dark"] .tag.found{background:#1F4A36;color:#CDEBD9}
.meta{color:var(--muted);font-size:.85rem}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--glaze);color:var(--glaze-ink);min-height:44px}
.btn.alt{background:transparent;border:2px solid var(--glaze);color:var(--glaze)}
.btn.kiln{background:var(--kiln);color:var(--kiln-ink)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.9rem}
.btn:disabled{opacity:.55;cursor:default}
input,select{width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);min-height:44px}
label{display:block;font-weight:700;font-size:.88rem;margin:10px 0 4px}
.seg{display:flex;gap:6px;background:var(--bg);border-radius:14px;padding:4px}
.seg button{flex:1;border:0;border-radius:10px;padding:9px;background:transparent;font-weight:700;color:var(--muted);min-height:40px}
.seg button.on{background:var(--glaze);color:var(--glaze-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.chips button{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:700;min-height:38px}
.chips button.on{background:var(--glaze);color:var(--glaze-ink);border-color:var(--glaze)}

/* hero pot */
.hero{display:flex;gap:16px;align-items:center;background:var(--glaze);color:var(--glaze-ink);border-radius:26px;padding:18px;margin-bottom:16px}
.hero h1{font-size:1.7rem;font-weight:800}
.hero .lv{font-size:.95rem;opacity:.9;margin-top:4px}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.28);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--kiln);border-radius:9px;transition:width .5s}
.pot{flex:none;width:104px;height:112px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.tile{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
.tile b{font-family:var(--head);font-size:1.02rem}
.tile span.e{font-size:1.6rem}
.tile.wide{grid-column:span 2;background:var(--celadon);border-color:transparent}
.tile small{color:var(--muted)}

/* canteen */
.meter{display:flex;gap:6px;margin:10px 0}
.meter button{flex:1;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 4px;font-weight:700;min-height:44px}
.meter button.on{border-color:var(--glaze);background:var(--celadon)}
.hours{display:flex;align-items:flex-end;gap:5px;height:70px;margin-top:8px}
.hours div{flex:1;border-radius:5px 5px 2px 2px;background:var(--celadon);position:relative}
.hours div.now{background:var(--kiln)}
.hours div.best{background:var(--ok)}
.hl{display:flex;gap:5px}.hl span{flex:1;text-align:center;font-size:.68rem;color:var(--muted)}
.lvl{font-family:var(--head);font-weight:800;font-size:1.05rem}
.lvl.low{color:var(--ok)}.lvl.mid{color:#B7791F}.lvl.high{color:var(--danger)}

/* wellness */
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.moods button{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 0;font-size:1.7rem;line-height:1;min-height:60px}
.moods button.on{border-color:var(--glaze);background:var(--celadon)}
.moods small{display:block;font-size:.68rem;color:var(--muted);margin-top:4px}

.lb{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.lb:first-of-type{border-top:0}
.lb .n{width:22px;font-family:var(--head);font-weight:800;color:var(--muted)}
.lb.me{font-weight:700}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:12px;color:var(--muted);font-size:.68rem;font-weight:700;min-height:52px}
nav button .e{font-size:1.25rem;line-height:1.2}
nav button.on{background:var(--celadon);color:var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;font-size:.9rem;opacity:0;pointer-events:none;transition:.25s;z-index:10;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:var(--muted);padding:20px}
.foot{text-align:center;margin-top:18px}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.85rem;min-height:40px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* splash */
#splash{position:fixed;inset:0;z-index:100;background:var(--glaze);color:var(--glaze-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  animation:splashOut .45s ease 2.1s forwards}
#splash svg{width:120px;height:130px}
#splash .fill{animation:potFill 1.7s cubic-bezier(.4,.1,.3,1) .25s both}
#splash h1{font-size:2.2rem;font-weight:800;animation:fadeIn .6s ease .5s both}
#splash p{opacity:.85;font-size:.95rem;animation:fadeIn .6s ease .8s both}
#splash .ld{width:140px;height:5px;border-radius:9px;background:rgba(255,255,255,.28);overflow:hidden;margin-top:6px}
#splash .ld i{display:block;height:100%;width:100%;background:var(--kiln);transform-origin:left;animation:ldBar 1.8s ease .2s both}
@keyframes potFill{from{transform:translateY(90px)}to{transform:translateY(0)}}
@keyframes ldBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){
  #splash{animation:splashOut .3s ease .9s forwards}
  #splash .fill,#splash h1,#splash p,#splash .ld i{animation:none}
}

.ph{width:100%;max-height:220px;object-fit:cover;border-radius:14px;margin:8px 0 2px;display:block;cursor:zoom-in;background:var(--bg)}
.pv{position:relative;margin-top:8px}
.pv img{width:100%;max-height:200px;object-fit:cover;border-radius:14px;display:block}
.pv button{position:absolute;top:8px;right:8px}
.hid{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#zoom{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
#zoom.on{display:flex}
#zoom img{max-width:100%;max-height:100%;border-radius:12px}
.th{flex:none;width:64px;height:64px;border-radius:12px;object-fit:cover;cursor:zoom-in;background:var(--bg)}
.srch{margin-bottom:10px}

/* v3 upgrade */
body{background:radial-gradient(800px 380px at 8% -8%,rgba(242,184,75,.2),transparent),radial-gradient(700px 400px at 100% 0,rgba(63,154,139,.22),transparent),var(--bg);background-attachment:fixed}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pulse{50%{transform:scale(1.25);opacity:.6}}
.card{box-shadow:0 8px 24px -14px rgba(20,38,43,.4);animation:rise .5s ease both}
.tile{animation:rise .5s ease both;transition:transform .15s;box-shadow:0 8px 24px -14px rgba(20,38,43,.4)}
.tile:nth-child(2){animation-delay:.06s}.tile:nth-child(3){animation-delay:.12s}.tile:nth-child(4){animation-delay:.18s}.tile:nth-child(5){animation-delay:.24s}
.tile:active,.btn:active{transform:scale(.96)}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--glaze),color-mix(in srgb,var(--glaze) 62%,#F2B84B));box-shadow:0 16px 36px -18px rgba(31,85,96,.7)}
.hero::after{content:'';position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:radial-gradient(rgba(242,184,75,.55),transparent 70%);animation:pulse 4s ease-in-out infinite;pointer-events:none}
nav{left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));padding:6px;border:1px solid var(--line);border-radius:24px;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 14px 34px -12px rgba(0,0,0,.4)}
nav button{transition:background .2s,transform .2s}
nav button.on{background:var(--glaze);color:var(--glaze-ink);transform:translateY(-2px)}
#toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.bg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center}
.bg div{font-size:.68rem;font-weight:700;color:var(--muted)}
.bg span{display:block;font-size:1.6rem;width:52px;height:52px;line-height:52px;margin:0 auto 4px;border-radius:16px;background:var(--celadon)}
.bg .off{opacity:.35;filter:grayscale(1)}
.breath{width:110px;height:110px;border-radius:50%;margin:14px auto 8px;background:radial-gradient(circle at 35% 30%,var(--kiln),var(--glaze));transform:scale(.6);box-shadow:0 0 40px rgba(242,184,75,.4)}
.breath.go{animation:br 9s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(.6)}33%,66%{transform:scale(1.05)}}
#lvlup{position:fixed;inset:0;z-index:70;background:rgba(6,16,20,.7);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center}
#lvlup.on{display:flex}
.lu{background:var(--surface);border-radius:28px;padding:28px 40px;text-align:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}}
/* cinematic opening */
#splash{background:radial-gradient(circle at 50% 38%,#2E8578 0,#1F5560 45%,#0E1C20 100%);animation:splashOut .7s ease 3.1s forwards}
@keyframes splashOut{to{opacity:0;visibility:hidden;transform:scale(1.18);filter:blur(10px)}}
.stage{position:relative;width:150px;height:150px;display:grid;place-items:center}
.stage svg{animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 12px 22px rgba(0,0,0,.4))}
@keyframes bob{50%{transform:translateY(-8px)}}
.rg{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(242,184,75,.55);animation:ring 2.4s ease-out infinite}
.rg.r2{animation-delay:1.2s}
@keyframes ring{from{transform:scale(.5);opacity:.9}to{transform:scale(1.6);opacity:0}}
.sp{position:absolute;width:8px;height:8px;border-radius:50%;background:#F2B84B;box-shadow:0 0 12px #F2B84B;animation:spark 2s ease-in-out infinite}
.s1{top:8px;left:14px}.s2{top:34px;right:4px;animation-delay:.5s}.s3{bottom:18px;left:0;animation-delay:1s}
@keyframes spark{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1.2) translateY(-8px)}}
#splash h1{animation:none;letter-spacing:.02em}
#splash h1 span{display:inline-block;animation:letter .7s cubic-bezier(.2,1.4,.4,1) calc(.6s + var(--i)*.08s) both}
@keyframes letter{from{opacity:0;transform:translateY(26px) scale(.5)}}
#splash .ld i{animation-duration:2.7s}
@media (prefers-reduced-motion:reduce){#splash{animation:splashOut .3s ease 1s forwards}.stage svg,.rg,.sp,.hero::after,.breath.go{animation:none}#splash h1 span{animation:none}}
#auth{position:fixed;inset:0;z-index:90;overflow-y:auto;display:none;background:radial-gradient(700px 360px at 50% -10%,rgba(242,184,75,.28),transparent),var(--bg)}
body.noauth #auth{display:block}body.noauth .app,body.noauth nav{display:none}
.au{max-width:420px;margin:0 auto;padding:calc(30px + env(safe-area-inset-top,0px)) 20px 40px;animation:rise .5s ease both}
.au h1{text-align:center;font-size:1.7rem;font-weight:800}.au .sub{text-align:center;margin-top:4px}
.aupot{font-size:3.2rem;text-align:center}.aerr{color:var(--danger);font-weight:700;font-size:.9rem;margin-top:8px}
.av{width:92px;height:92px;border-radius:50%;border:3px solid var(--kiln);background:var(--glaze);color:var(--glaze-ink);font-family:var(--head);font-weight:800;font-size:2rem;overflow:hidden;padding:0;display:grid;place-items:center;margin:0 auto}
.av img{width:100%;height:100%;object-fit:cover}
.stat{display:grid;grid-template-columns:repeat(4,1fr);text-align:center}.stat b{display:block;font-family:var(--head);font-size:1.4rem}.stat span{font-size:.75rem;color:var(--muted)}
.hav{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--kiln);background:var(--glaze);color:var(--glaze-ink);font-family:var(--head);font-weight:800;overflow:hidden;padding:0;display:grid;place-items:center}
.hav img{width:100%;height:100%;object-fit:cover}
nav .in{grid-template-columns:repeat(6,minmax(0,1fr))}nav button{font-size:.62rem;white-space:nowrap}
</style>
</head>
<body>
<div id="splash" role="status" aria-label="Loading ClayHub">
  <div class="stage"><i class="rg"></i><i class="rg r2"></i><svg viewBox="0 0 120 130" aria-hidden="true"><defs><clipPath id="sc"><path d="M27 34 L33 104 Q35 120 52 120 L68 120 Q85 120 87 104 L93 34 Z"/></clipPath></defs>
    <path d="M27 34 L33 104 Q35 120 52 120 L68 120 Q85 120 87 104 L93 34 Z" fill="rgba(255,255,255,.14)"/>
    <g clip-path="url(#sc)"><rect class="fill" x="20" y="32" width="80" height="92" fill="#F2B84B"/></g>
    <path d="M27 34 L33 104 Q35 120 52 120 L68 120 Q85 120 87 104 L93 34" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    <rect x="20" y="24" width="80" height="12" rx="6" fill="#fff"/></svg><b class="sp s1"></b><b class="sp s2"></b><b class="sp s3"></b></div>
  <h1 aria-label="ClayHub"><span style="--i:0">C</span><span style="--i:1">l</span><span style="--i:2">a</span><span style="--i:3">y</span><span style="--i:4">H</span><span style="--i:5">u</span><span style="--i:6">b</span></h1><p>Shaping a better campus together</p>
  <div class="ld"><i></i></div>
</div>
<div id="auth"></div>
<div class="app" id="app"></div>
<div id="zoom" role="dialog" aria-label="Photo preview"><img alt="Item photo"></div>
<div id="lvlup" role="dialog" aria-label="Level up"><div class="lu"><div style="font-size:3.2rem">🏺</div><p class="meta">Level up!</p><h2></h2><p class="meta" style="margin-top:8px">Tap to continue</p></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<nav aria-label="Modules"><div class="in" id="nav"></div></nav>

<script>
(function(){
var KEY='clayhub-proto-v2';
function seed(){return{
  karma:40, tab:'home', lfMode:'lost', shelfFilter:'All', claiming:null,
  log:[{t:'Joined ClayHub',p:40}],
  items:[
    {id:1,type:'found',title:'Blue water bottle',place:'Library, 2nd floor',when:'Today',q:'What sticker is on the lid?',status:'open',mine:false},
    {id:2,type:'lost',title:'Black calculator (Casio fx-991)',place:'Block C, Room 204',when:'Yesterday',q:'',status:'open',mine:false},
    {id:3,type:'found',title:'Student ID card',place:'Canteen entrance',when:'Today',q:'What is the department name on it?',status:'open',mine:false}
  ],
  shelf:[
    {id:1,kind:'Notes',title:'Engineering Maths II, full notes',who:'Riya, 4th sem',state:'free'},
    {id:2,kind:'Book',title:'Data Structures by Tanenbaum',who:'Arjun, 6th sem',state:'free'},
    {id:3,kind:'Lab coat',title:'Lab coat, size M',who:'Sneha, 4th sem',state:'free'},
    {id:4,kind:'Notes',title:'Organic Chemistry handwritten',who:'Kabir, 2nd sem',state:'free'}
  ],
  skills:[
    {id:1,who:'Meera',offer:'Python basics',want:'Guitar lessons',state:'open'},
    {id:2,who:'Dev',offer:'Poster and logo design',want:'Excel help',state:'open'},
    {id:3,who:'Ishaan',offer:'Guitar (beginner)',want:'Public speaking tips',state:'open'}
  ],
  moods:[3,2,3,4,3,4,null],bd:[],streak:null,
  moodNote:''
};}
var UK='clayhub-users',SK='clayhub-session',CU=null,ME=null,S,A={};
function users(){try{return JSON.parse(localStorage.getItem(UK)||'{}')}catch(e){return{}}}
function skey(){return KEY+':'+(CU||'guest')}
function load(uid){
  CU=uid;ME=uid?users()[uid]||null:null;
  try{S=JSON.parse(localStorage.getItem(skey())||'null')}catch(e){S=null}
  if(!S||!S.items)S=seed();
  if(['home','lost','shelf','swap','mind','me'].indexOf(S.tab)<0)S.tab='home';
  if(!S.bd)S.bd=[];
  var d=function(o){return new Date(Date.now()-o*864e5).toISOString().slice(0,10)},t=d(0);
  if(!S.streak)S.streak={d:t,n:1};else if(S.streak.d!==t)S.streak={d:t,n:S.streak.d===d(1)?S.streak.n+1:1};
  if(S.theme)document.documentElement.setAttribute('data-theme',S.theme);else document.documentElement.removeAttribute('data-theme');
}
function save(){try{localStorage.setItem(skey(),JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var pendingPhoto=null, pendingShelf=null;
var $app=document.getElementById('app'),$nav=document.getElementById('nav'),$toast=document.getElementById('toast'),tt;
function toast(m){$toast.textContent=m;$toast.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){$toast.classList.remove('show')},2200)}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

  if(played||!AC||!document.getElementById('splash'))return;played=true;
  var t=AC.currentTime+.05;MG=AC.createGain();MG.gain.value=.85;
  var dl=AC.createDelay(),fb=AC.createGain(),wet=AC.createGain();dl.delayTime.value=.3;fb.gain.value=.4;wet.gain.value=.45;
  MG.connect(AC.destination);MG.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(AC.destination);
  [130.81,196,329.63,493.88].forEach(function(f){note(f,t,3.4,.07)});            /* warm pad: C major 9 */
  [110,164.81,261.63,392].forEach(function(f){note(f,t+1.7,2.6,.06)});           /* pad moves to A minor */
  [[659.25,.35],[783.99,.65],[1046.5,.95],[987.77,1.4],[880,1.85],[783.99,2.15],[1046.5,2.55],[1318.5,2.95]].forEach(function(n){bell(n[0],t+n[1],.17)});
  bell(2093,t+3.05,.05);
}
function fadeMusic(){played=true;if(MG){var n=AC.currentTime;MG.gain.cancelScheduledValues(n);MG.gain.setValueAtTime(MG.gain.value,n);MG.gain.linearRampToValueAtTime(0,n+.65)}
  setTimeout(function(){try{AC&&AC.close()}catch(e){}},900)}
function startSound(){
  try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  if(AC.state==='running'){music();return}
  if(AC.resume)AC.resume().then(function(){if(AC.state==='running')music()}).catch(function(){});
  /* if the browser blocks autoplay, the music starts on the first touch while the opening is still showing */
  var g=function(){document.removeEventListener('pointerdown',g);document.removeEventListener('keydown',g);try{AC.resume().then(music)}catch(e){}};
  document.addEventListener('pointerdown',g);document.addEventListener('keydown',g);
}

  '<div class="seg" style="margin-top:14px"><button data-a="amode" data-v="login" class="'+(!su?'on':'')+'">Log in</button><button data-a="amode" data-v="signup" class="'+(su?'on':'')+'">Sign up</button></div>'+
  '<div class="chips" style="margin-top:14px">'+[['email','✉️ Email'],['phone','📱 Phone'],['usn','🎓 DSU USN']].map(function(x){return '<button data-a="ameth" data-v="'+x[0]+'" class="'+(m===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('')+'</div>'+
  (su?'<label for="a-n">Full name</label><input id="a-n" data-af="name" autocomplete="name" value="'+esc(A.name||'')+'">':'')+
  '<label for="a-i">'+lb+'</label><input id="a-i" data-af="id" type="'+ty+'" placeholder="'+ph+'" autocapitalize="off" value="'+esc(A.id||'')+'">'+
  '<label for="a-p">Password</label><input id="a-p" data-af="pw" type="password" placeholder="At least 6 characters" autocomplete="'+(su?'new-password':'current-password')+'" value="'+esc(A.pw||'')+'">'+
  (A.err?'<p class="aerr" role="alert">'+esc(A.err)+'</p>':'')+
  '<button class="btn" style="width:100%;margin-top:16px" data-a="asubmit">'+(su?'Create account':'Log in')+'</button>'+
  '<div class="foot"><button data-a="aguest">Continue as guest</button></div><p class="meta" style="text-align:center;font-size:.78rem">Accounts are saved on this device only.</p></div>';
}
function showAuth(){A={mode:'login',method:'email',id:'',pw:'',name:'',err:''};document.body.classList.add('noauth');renderAuth();window.scrollTo(0,0)}
function enter(){document.body.classList.remove('noauth');render()}
function aerr(m){A.err=m;renderAuth()}
function submitAuth(){
  var m=A.method,raw=(A.id||'').trim(),pw=A.pw||'',nm=(A.name||'').trim(),id,su=A.mode==='signup';
  if(su&&nm.length<2)return aerr('Enter your full name');
  if(m==='email'){id=raw.toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(id))return aerr('Enter a valid email address')}
  else if(m==='phone'){id=raw.replace(/\D/g,'').slice(-10);if(!/^[6-9]\d{9}$/.test(id))return aerr('Enter a valid 10-digit mobile number')}
  else{id=raw.toUpperCase().replace(/\s/g,'');if(!/^ENG\d{2}[A-Z]{2,4}\d{3,4}$/.test(id))return aerr('Enter a valid DSU USN, for example ENG23CS0001')}
  if(pw.length<6)return aerr('Password must be at least 6 characters');
  var uid=m+':'+id,U=users();
  if(su){if(U[uid])return aerr('This account already exists. Please log in.');
    var salt=Date.now()+'-'+Math.random();
    hash(pw,salt,function(h){U[uid]={name:nm,m:m,id:id,salt:salt,h:h,at:Date.now()};try{localStorage.setItem(UK,JSON.stringify(U));localStorage.setItem(SK,uid)}catch(e){}load(uid);enter();toast('Welcome to ClayHub, '+first()+'!')})}
  else{var u=U[uid];if(!u)return aerr('No account found. Please sign up first.');
    hash(pw,u.salt,function(h){if(h!==u.h)return aerr('Wrong password');try{localStorage.setItem(SK,uid)}catch(e){}load(uid);enter();toast('Welcome back, '+first())})}
}
function boot(){var sid=null;try{sid=localStorage.getItem(SK)}catch(e){}load(null);if(sid&&users()[sid]){load(sid);enter()}else showAuth()}
function vMe(){
  var L=levelInfo(S.karma),nm=ME?ME.name:'Guest',idl=ME?({email:'Email',phone:'Phone',usn:'DSU USN'}[ME.m])+': '+(ME.m==='phone'?'+91 ':'')+ME.id:'Guest mode: data stays on this device';
  var st=[[S.items.filter(function(i){return i.mine}).length,'Posts'],[S.shelf.filter(function(i){return i.who==='You'}).length,'Shared'],[S.skills.filter(function(i){return i.who==='You'}).length,'Swaps'],[S.moods.filter(function(v){return v!==null}).length,'Check-ins']];
  return '<div class="card" style="text-align:center"><input type="file" id="av-file" class="hid" accept="image/*" tabindex="-1"><button class="av" data-a="avpick" aria-label="Change profile photo">'+(S.avatar?'<img src="'+S.avatar+'" alt="Your photo">':initials(nm))+'</button>'+
  '<h2 style="margin-top:10px">'+esc(nm)+'</h2><p class="meta">'+esc(idl)+'</p><p style="margin-top:8px"><span class="tag">'+L.name+' · Lv '+(L.i+1)+'</span> <span class="tag">'+S.karma+' karma</span> <span class="tag">🔥 '+sn()+'</span></p>'+(ME?'<p class="meta" style="margin-top:6px">Member since '+new Date(ME.at).toLocaleDateString()+'</p>':'')+'</div>'+
  '<div class="card"><div class="stat">'+st.map(function(x){return '<div><b>'+x[0]+'</b><span>'+x[1]+'</span></div>'}).join('')+'</div></div>'+badgesHtml()+
  (ME?'<div class="card"><h3 style="margin-bottom:6px">Edit name</h3><div class="row"><input id="p-n" value="'+esc(ME.name)+'" aria-label="Your name"><button class="btn sm" data-a="savename">Save</button></div></div>':'<div class="card"><p class="meta">You are in guest mode. Log out and create an account to keep your progress under your name.</p></div>')+
  '<div class="card"><button class="btn alt" style="width:100%" data-a="logout">Log out</button>'+(ME?'<button class="btn" style="width:100%;margin-top:8px;background:var(--danger);color:#fff" data-a="delacct">Delete my account</button>':'')+'</div>';
}
var VIEWS={home:vHome,lost:vLost,shelf:vShelf,swap:vSwap,mind:vMind,me:vMe};
function render(keepScroll){
  var y=window.scrollY;
  $nav.innerHTML=navHtml();
  $app.innerHTML=VIEWS[S.tab]();
  if(keepScroll)window.scrollTo(0,y);else window.scrollTo(0,0);
}
function val(id){var e=document.getElementById(id);return e?e.value.trim():''}
function need(v,m){if(!v){toast(m);return false}return true}

document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-a]');if(!b)return;
  var a=b.dataset.a,v=b.dataset.v,id=Number(v);
  if(a==='tab'){S.tab=v;S.claiming=null;save();render();return}
  if(a==='reset'){S=seed();save();render();toast('Demo reset');return}
  if(a==='lfmode'){S.lfMode=v;save();render(true);return}
  if(a==='lfpost'){
    var t=val('lf-t'),p=val('lf-p'),q=val('lf-q');
    if(!need(t,'Add what the item is')||!need(p,'Add where it was'))return;
    if(S.lfMode==='found'&&!need(q,'Add a proof question for the owner'))return;
    var ph=pendingPhoto;pendingPhoto=null;
    S.items.unshift({id:Date.now(),type:S.lfMode,title:t,place:p,when:'Just now',q:q,status:'open',mine:true,photo:ph||''});
    award((S.lfMode==='found'?10:2)+(ph?3:0),(S.lfMode==='found'?'Posted a found item':'Posted a lost item')+(ph?' with a photo':''));render();return}
  if(a==='pick'){var fi=document.getElementById(b.dataset.k==='sh'?'sh-file':'lf-file');if(fi)fi.click();return}
  if(a==='unpick'){var k=b.dataset.k;if(k==='sh')pendingShelf=null;else pendingPhoto=null;var pv=document.getElementById(k+'-prev');if(pv)pv.innerHTML=prevHtml(k);return}
  if(a==='zoom'){var src=b.dataset.k==='sh'?S.shelf:S.items;var it=src.filter(function(x){return x.id===id})[0];if(it&&it.photo){var z=document.getElementById('zoom');z.querySelector('img').src=it.photo;z.classList.add('on')}return}
  if(a==='lffilter'){S.lfFilter=v;save();document.getElementById('lf-chips').innerHTML=lfChips();document.getElementById('lf-list').innerHTML=lfList();return}
  if(a==='lfclaim'){S.claiming=id;save();render(true);return}
  if(a==='lfsend'){if(!need(val('lf-ans'),'Type your answer first'))return;S.claiming=null;save();render(true);toast('Answer sent to the finder for review');return}
  if(a==='lfseen'){award(10,'Spotted a lost item');render(true);return}
  if(a==='lfreturn'){S.items.forEach(function(i){if(i.id===id)i.status='claimed'});award(20,'Returned an item to its owner');render(true);return}
  if(a==='sfilter'){S.shelfFilter=v;save();render(true);return}
  if(a==='sreq'){S.shelf.forEach(function(i){if(i.id===id)i.state='req'});save();render(true);toast('Request sent to the owner');return}
  if(a==='sdon'){var t2=val('sh-t');if(!need(t2,'Add the item name'))return;
    var sp2=pendingShelf;pendingShelf=null;
    S.shelf.unshift({id:Date.now(),kind:document.getElementById('sh-k').value,title:t2,who:'You',state:'free',photo:sp2||''});award(15+(sp2?3:0),'Donated to the Share Shelf'+(sp2?' with a photo':''));render(true);return}
  if(a==='swreq'){S.skills.forEach(function(s){if(s.id===id)s.state='sent'});award(5,'Proposed a skill swap');render(true);return}
  if(a==='swadd'){var o=val('sw-o'),w=val('sw-w');if(!need(o,'Add a skill you can teach')||!need(w,'Add a skill you want to learn'))return;
    S.skills.unshift({id:Date.now(),who:'You',offer:o,want:w,state:'sent'});award(5,'Listed a skill');render(true);return}
  if(a==='amode'){A.mode=v;A.err='';renderAuth();return}
  if(a==='ameth'){A.method=v;A.err='';renderAuth();return}
  if(a==='asubmit'){submitAuth();return}
  if(a==='aguest'){try{localStorage.removeItem(SK)}catch(e){}load(null);enter();return}
  if(a==='logout'){try{localStorage.removeItem(SK)}catch(e){}load(null);showAuth();toast('Logged out');return}
  if(a==='delacct'){if(confirm('Delete your account and all its data from this device? This cannot be undone.')){var U=users();delete U[CU];try{localStorage.setItem(UK,JSON.stringify(U));localStorage.removeItem(skey());localStorage.removeItem(SK)}catch(e){}load(null);showAuth();toast('Account deleted')}return}
  if(a==='savename'){var nn=val('p-n');if(!need(nn.length>1?nn:'','Enter a valid name'))return;var U2=users();if(U2[CU]){U2[CU].name=nn;try{localStorage.setItem(UK,JSON.stringify(U2))}catch(e){}ME=U2[CU]}render(true);toast('Name updated');return}
  if(a==='avpick'){var f2=document.getElementById('av-file');if(f2)f2.click();return}
  if(a==='theme'){S.theme=!S.theme?'dark':S.theme==='dark'?'light':'';if(S.theme)document.documentElement.setAttribute('data-theme',S.theme);else document.documentElement.removeAttribute('data-theme');save();render(true);return}
  if(a==='share'){var it=S.items.filter(function(x){return x.id===id})[0];if(!it)return;var tx=(it.type==='lost'?'Lost: ':'Found: ')+it.title+' at '+it.place+' (via ClayHub)';
    if(navigator.share){navigator.share({title:'ClayHub',text:tx}).catch(function(){})}else if(navigator.clipboard){navigator.clipboard.writeText(tx);toast('Copied, ready to share')}else toast(tx);return}
  if(a==='mic'){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Voice search is not supported here');return}
    var r=new SR();r.lang='en-IN';r.onresult=function(e){var q=e.results[0][0].transcript;S.lfQuery=q;save();var i2=document.getElementById('lf-search');if(i2)i2.value=q;document.getElementById('lf-list').innerHTML=lfList();toast('Heard: '+q)};r.onerror=function(){toast('Could not hear that')};toast('Listening...');r.start();return}
  if(a==='breath'){var el=document.getElementById('br'),lb=document.getElementById('brl');if(!el||bt)return;el.classList.add('go');var st=['Breathe in…','Hold…','Breathe out…'],k=0,n=0;lb.textContent=st[0];buzz(20);
    bt=setInterval(function(){lb=document.getElementById('brl');if(!lb){clearInterval(bt);bt=0;return}k=(k+1)%3;if(k===0)n++;lb.textContent=st[k];
      if(n>=3){clearInterval(bt);bt=0;el.classList.remove('go');lb.textContent='Well done. Feeling calmer?';S.breath=(S.breath||0)+1;award(5,'Mindful breathing')}},3000);return}
  if(a==='mood'){var first2=S.moods[6]===null;S.moods[6]=id;save();if(first2)award(3,'Daily check-in');else toast('Check-in updated');render(true);return}
});
document.addEventListener('change',function(ev){
  var id=ev.target.id;
  if(id==='av-file'&&ev.target.files&&ev.target.files[0]){shrink(ev.target.files[0],function(d){S.avatar=d;save();render(true)});return}
  if((id!=='lf-file'&&id!=='sh-file')||!ev.target.files||!ev.target.files[0])return;
  var f=ev.target.files[0],k=id==='sh-file'?'sh':'lf';
  if(f.type.indexOf('image/')!==0){toast('Choose an image file');return}
  shrink(f,function(d){if(k==='sh')pendingShelf=d;else pendingPhoto=d;var pv=document.getElementById(k+'-prev');if(pv)pv.innerHTML=prevHtml(k)});
});
document.addEventListener('input',function(ev){
  if(ev.target.dataset&&ev.target.dataset.af){A[ev.target.dataset.af]=ev.target.value;return}
  if(ev.target.id!=='lf-search')return;
  S.lfQuery=ev.target.value;save();document.getElementById('lf-list').innerHTML=lfList();
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.af)submitAuth()});
document.getElementById('zoom').addEventListener('click',function(){this.classList.remove('on')});
document.getElementById('lvlup').addEventListener('click',function(){this.classList.remove('on')});
document.addEventListener('keydown',function(e){if(e.key==='Escape')document.getElementById('zoom').classList.remove('on')});
boot();
startSound();
var sp=document.getElementById('splash');
if(sp){sp.addEventListener('animationstart',function(e){if(e.animationName==='splashOut')fadeMusic()});sp.addEventListener('animationend',function(e){if(e.animationName==='splashOut')sp.remove()})}
})();
</script>
